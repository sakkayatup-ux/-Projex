<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบสวัสดิการ</title>
    
    <!-- เรียกใช้ไฟล์ CSS โดยถอยกลับ 1 โฟลเดอร์ด้วย ../ -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-container">
        <h2>🔑 เข้าสู่ระบบสวัสดิการ</h2>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="form-control" placeholder="เช่น employee1" required>
            </div>
            
            <div class="form-group">
                <label for="password">รหัสผ่าน (Password)</label>
                <input type="password" id="password" class="form-control" placeholder="รหัสผ่าน" required>
            </div>

            <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script src="../js/activityLogger.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
