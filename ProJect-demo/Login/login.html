<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../Data/data.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #e3edfe 0%, #f3f7fc 100%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .login-box {
            display: flex; background: white; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 800px; max-width: 90%; overflow: hidden;
        }
        .login-left { flex: 1; background: #07305b; color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .login-right { flex: 1; padding: 40px; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-left">
        <h1 style="font-size: 22px; margin-bottom: 15px;">ระบบข้อมูลพนักงาน<br>และสวัสดิการ</h1>
        <p style="opacity: 0.8; font-size: 13px;">จัดการข้อมูลพนักงานและสวัสดิการอย่างครอบคลุม</p>
    </div>
    <div class="login-right">
        <h2 style="color: #07305b; margin-bottom: 8px;">เข้าสู่ระบบ</h2>
        <p style="color: #788592; font-size: 13px; margin-bottom: 20px;">ทดสอบเข้าสู่ระบบด้วยรหัสพนักงานหรือแอดมิน</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>รหัสผู้ใช้งาน</label>
                <select id="userSelect" class="form-control">
                    <option value="EMP00123">พนักงาน : EMP00123 (นนท์ วัฒนกิจ)</option>
                    <option value="ADMIN001">ผู้ดูแลระบบ : ADMIN001 (สมศักดิ์ HR)</option>
                </select>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" class="form-control" value="123456" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">เข้าสู่ระบบ</button>
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const selectedId = document.getElementById('userSelect').value;
    const user = USERS[selectedId];
    
    // บันทึกเซสชัน
    localStorage.setItem('current_user', JSON.stringify(user));
    
    // เปลี่ยนหน้าไป Home
    window.location.href = '../หน้า HOME/index.html';
});
</script>
</body>
</html>
