<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../Data/data.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #e3edfe 0%, #f3f7fc 100%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .login-box {
            display: flex; background: white; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 800px; max-width: 90%; overflow: hidden;
        }
        .login-left { flex: 1; background: #07305b; color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .login-right { flex: 1; padding: 40px; }
        .demo-box {
            margin-top: 15px; padding: 10px; background: #f8fbfd;
            border: 1px solid #dae8f6; border-radius: 6px; font-size: 12px; color: #4b5a69;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-left">
        <h1 style="font-size: 22px; margin-bottom: 15px;">ระบบข้อมูลพนักงาน<br>และสวัสดิการ</h1>
        <p style="opacity: 0.8; font-size: 13px;">จัดการข้อมูลพนักงานและสวัสดิการอย่างครอบคลุม</p>
    </div>
    <div class="login-right">
        <h2 style="color: #07305b; margin-bottom: 8px;">เข้าสู่ระบบ</h2>
        <p style="color: #788592; font-size: 13px; margin-bottom: 20px;">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ระบบ</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="usernameInput" class="form-control" placeholder="เช่น staff01 หรือ admin" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="กรอกรหัสผ่าน" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">เข้าสู่ระบบ</button>
        </form>

        <div class="demo-box">
            <strong>🔑 ข้อมูลสำหรับทดสอบเข้าสู่ระบบ:</strong><br>
            • พนักงาน 1: <code>staff01</code> / รหัสผ่าน <code>123</code><br>
            • พนักงาน 2: <code>staff02</code> / รหัสผ่าน <code>123</code><br>
            • Admin HR: <code>admin</code> / รหัสผ่าน <code>123</code>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();

    // ค้นหาผู้ใช้จากข้อมูลใน data.js
    const userKey = Object.keys(USERS).find(key => {
        const u = USERS[key];
        return u.username === username && u.password === password;
    });

    if (userKey) {
        const user = USERS[userKey];
        // บันทึกผู้ใช้ลงใน localStorage
        localStorage.setItem('current_user', JSON.stringify(user));
        
        alert(`เข้าสู่ระบบสำเร็จ!\nยินดีต้อนรับ: ${user.name} (${user.roleName})`);
        
        // สั่งเด้งไปที่หน้า Home
        window.location.href = '../หน้า HOME/index.html';
    } else {
        alert('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!');
    }
});
</script>
</body>
</html>
