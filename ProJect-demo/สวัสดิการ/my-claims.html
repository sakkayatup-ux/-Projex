<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. ติดตามสถานะคำขอ (พนักงาน)</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../Data/data.js"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">ระบบข้อมูลพนักงาน<br>&nbsp;และสวัสดิการ</div>
        <ul class="menu" id="mainMenu"></ul>
    </aside>

    <main class="main">
        <header class="header">
            <div class="logo-title">คำขอของฉัน</div>
            <div class="header-right">
                <button class="notif-btn">🔔</button>
                <div class="profile" id="headerProfile"></div>
            </div>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>เลขที่คำขอ</th><th>ประเภทสวัสดิการ</th><th>วันที่ยื่นคำขอ</th><th>จำนวนเงิน</th><th>สถานะ</th><th>จัดการ</th></tr>
                </thead>
                <tbody id="claimsTable"></tbody>
            </table>
        </div>
    </main>
</div>

<script>
renderSidebarMenu('my-claims');

const claims = getClaims();
const tbody = document.getElementById('claimsTable');

claims.forEach(c => {
    let badgeClass = 'badge-warning';
    if(c.status === 'กำลังดำเนินการ') badgeClass = 'badge-info';
    if(c.status === 'อนุมัติแล้ว') badgeClass = 'badge-success';
    if(c.status === 'ไม่อนุมัติ') badgeClass = 'badge-danger';

    tbody.innerHTML += `
        <tr>
            <td>${c.id}</td>
            <td>${c.type}</td>
            <td>${c.date}</td>
            <td>${c.amount}</td>
            <td><span class="badge ${badgeClass}">${c.status}</span></td>
            <td><a href="approve.html?id=${c.id}" class="see-all">ดูรายละเอียด</a></td>
        </tr>
    `;
});
</script>
</body>
</html>
