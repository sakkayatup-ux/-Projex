<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. HR Admin - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../Data/data.js"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">ระบบข้อมูลพนักงาน<br>&nbsp;และสวัสดิการ</div>
        <ul class="menu" id="mainMenu"></ul>
    </aside>

    <main class="main">
        <header class="header">
            <div class="logo-title">ภาพรวมคำขอสวัสดิการ (HR)</div>
            <div class="header-right">
                <button class="notif-btn">🔔</button>
                <div class="profile" id="headerProfile"></div>
            </div>
        </header>

        <section class="status">
            <div class="status-card"><h3>คำขอทั้งหมด</h3><p>156</p></div>
            <div class="status-card"><h3>รอตรวจสอบ</h3><p class="orange">32</p></div>
            <div class="status-card"><h3>กำลังดำเนินการ</h3><p class="blue">18</p></div>
            <div class="status-card"><h3>อนุมัติแล้ว</h3><p class="green">102</p></div>
        </section>

        <div class="table-container">
            <h3 style="color: #07305b; margin-bottom: 15px;">คำขอล่าสุดที่รออนุมัติ</h3>
            <table>
                <thead>
                    <tr><th>เลขคำขอ</th><th>ชื่อพนักงาน</th><th>ประเภทสวัสดิการ</th><th>วันที่ยื่น</th><th>การจัดการ</th></tr>
                </thead>
                <tbody id="adminTable"></tbody>
            </table>
        </div>
    </main>
</div>

<script>
renderSidebarMenu('admin');

const claims = getClaims();
const tbody = document.getElementById('adminTable');

claims.forEach(c => {
    tbody.innerHTML += `
        <tr>
            <td>${c.id}</td>
            <td>${c.emp}</td>
            <td>${c.type}</td>
            <td>${c.date}</td>
            <td><a href="approve.html?id=${c.id}" class="btn btn-primary" style="padding: 4px 10px; font-size: 12px;">ตรวจสอบ</a></td>
        </tr>
    `;
});
</script>
</body>
</html>
